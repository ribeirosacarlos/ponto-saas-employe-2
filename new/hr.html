<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login HR – Preview</title>
  <script>
    tailwind = {}; tailwind.config = { darkMode: "class" };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#f3f4fb] flex items-center justify-center px-4 py-10">

  <div class="max-w-md w-full">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 px-8 py-10 space-y-7">

      <div class="flex items-center gap-3">
        <div class="h-11 w-11 rounded-2xl bg-[#1e2a78] flex items-center justify-center shadow-lg">
          <span class="text-white text-base font-semibold">HR</span>
        </div>
        <div class="flex flex-col">
          <span class="text-[11px] font-semibold tracking-[0.25em] uppercase text-slate-500">Synergy</span>
          <span class="text-xs text-slate-400 -mt-0.5">HR Management</span>
        </div>
      </div>

      <header class="space-y-1">
        <h1 class="text-slate-900 text-[22px] font-semibold">Entrar na Conta</h1>
        <p class="text-sm text-slate-500">Acesse o painel de gestão com segurança.</p>
      </header>

      <form class="space-y-5">

        <div class="space-y-2">
          <label class="text-xs font-medium text-slate-600">Email profissional</label>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 flex items-center gap-3 shadow-inner">
            <span class="inline-flex h-7 w-7 rounded-full bg-slate-100 text-slate-400 items-center justify-center">@</span>
            <input type="email" placeholder="nome.sobrenome@empresa.com" class="w-full bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-400" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-medium text-slate-600">Palavra-passe</label>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 flex items-center gap-3 shadow-inner">
            <span class="inline-flex h-7 w-7 rounded-full bg-slate-100 text-slate-400 items-center justify-center">🔒</span>
            <input type="password" placeholder="••••••••" class="w-full bg-transparent outline-none text-sm text-slate-900 placeholder:text-slate-400" />
            <button type="button" class="text-[11px] font-medium text-[#1e2a78]">Ver</button>
          </div>
        </div>

        <div class="flex items-center justify-end">
          <button type="button" class="text-xs font-medium text-slate-500 hover:text-[#1e2a78]">Esqueci minha senha</button>
        </div>

        <div class="space-y-3">
          <button class="w-full h-11 rounded-full bg-[#1e2a78] hover:bg-[#25338f] text-sm font-semibold text-white shadow-md active:scale-[0.98]">Entrar</button>
          <button class="w-full h-11 rounded-full border border-slate-300 text-sm font-semibold text-slate-700 bg-white hover:bg-slate-50">Criar Conta</button>
        </div>

      </form>
    </div>

    <div class="mt-5 flex items-center justify-center gap-3 text-[11px] text-slate-500">
      <div class="h-7 w-7 rounded-full bg-slate-200 flex items-center justify-center font-semibold text-slate-700">GH</div>
      <div class="flex flex-col leading-tight">
        <span class="font-medium text-slate-600">Sessão segura · HR Dashboard</span>
        <span>UI inspirada no iOS · Synergy HR</span>
      </div>
    </div>
  </div>

</body>
</html>
