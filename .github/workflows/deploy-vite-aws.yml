  name: Deploy Vite (dist) to AWS S3 + CloudFront (main)

  on:
    push:
      branches: ["main"]
    workflow_dispatch: {}

  permissions:
    id-token: write
    contents: read

  jobs:
    deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"

        - name: Install deps
          run: npm ci

        - name: Build (Vite)
          run: npm run build

        - name: Configure AWS credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}

        - name: Upload assets (cache long)
          run: |
            aws s3 sync dist s3://${{ vars.S3_BUCKET }} \
              --delete \
              --exclude "index.html" \
              --cache-control "public,max-age=31536000,immutable"

        - name: Upload index.html (no-cache)
          run: |
            aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "text/html"

        - name: Invalidate CloudFront
          run: |
            aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
              --paths "/*"