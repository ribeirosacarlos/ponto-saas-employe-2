  name: Deploy Vite (dist) to AWS S3 + CloudFront (main)

  on:
    push:
      branches: ["main"]
    schedule:
      - cron: "30 23 * * *"
    workflow_dispatch: {}

  permissions:
    id-token: write
    contents: read

  jobs:
    gate:
      runs-on: ubuntu-latest
      outputs:
        should_deploy: ${{ steps.check.outputs.should_deploy }}

      steps:
        - name: Check deploy window
          id: check
          shell: bash
          run: |
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            current_hm=$(TZ=America/Sao_Paulo date +%H%M)

            if [ "$current_hm" -le "0800" ] || [ "$current_hm" -ge "2030" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Deploy blocked: current Sao Paulo time is $current_hm, outside the allowed windows 00:00-08:00 and 20:30-23:59."
            fi

    deploy:
      needs: gate
      if: needs.gate.outputs.should_deploy == 'true'
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"

        - name: Install deps
          run: npm ci

        - name: Build (Vite)
          run: npm run build

        - name: Configure AWS credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}

        - name: Upload assets (cache long)
          run: |
            aws s3 sync dist s3://${{ vars.S3_BUCKET }} \
              --delete \
              --exclude "index.html" \
              --cache-control "public,max-age=31536000,immutable"

        - name: Upload index.html (no-cache)
          run: |
            aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "text/html"

        - name: Invalidate CloudFront
          run: |
            aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
              --paths "/*"
