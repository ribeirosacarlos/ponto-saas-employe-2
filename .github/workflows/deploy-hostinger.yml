name: Deploy Vite (dist) to Hostinger (main) — MAX DEBUG

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-and-debug-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      # --- SSH DEBUG BLOCK (MAX) ---
      - name: Setup SSH key (robusto)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write the private key exactly as stored in the secret
          cat > ~/.ssh/id_ed25519 << 'EOF'
          ${{ secrets.HOSTINGER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519

      - name: Show key fingerprint (safe)
        run: |
          echo "== Key fingerprint (private) =="
          ssh-keygen -lf ~/.ssh/id_ed25519 || true

          echo "== Validate private key (derive public) =="
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null \
            && echo "Private key OK (can derive public key)" \
            || (echo "Private key INVALID (secret likely wrong/malformed)" && exit 1)

      - name: Resolve host and check port reachability
        run: |
          echo "== Inputs =="
          echo "HOST=${{ secrets.HOSTINGER_HOST }}"
          echo "PORT=${{ secrets.HOSTINGER_PORT }}"
          echo "USER=${{ secrets.HOSTINGER_USER }}"
          echo "PATH=${{ secrets.HOSTINGER_PATH }}"

          echo "== DNS/IP resolve (if applicable) =="
          getent hosts ${{ secrets.HOSTINGER_HOST }} || true

          echo "== TCP port check =="
          timeout 6 bash -lc "cat < /dev/null > /dev/tcp/${{ secrets.HOSTINGER_HOST }}/${{ secrets.HOSTINGER_PORT }}" \
            && echo "Port OPEN" \
            || (echo "Port CLOSED/FILTERED (host/port wrong or blocked)" && exit 1)

      - name: ssh-keyscan (best effort, verbose)
        run: |
          set +e
          echo "== ssh-keyscan verbose (first 250 lines) =="
          ssh-keyscan -vvv -T 15 -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} 2>&1 | head -n 250
          echo "ssh-keyscan exit=$?"
          set -e

      - name: SSH handshake + auth methods (MAX DEBUG)
        run: |
          set +e
          echo "== SSH -vvv (this will show why auth fails) =="

          ssh -vvv -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/id_ed25519 \
            -o PreferredAuthentications=publickey,password \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=yes \
            -o KbdInteractiveAuthentication=no \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "whoami && pwd"

          echo "ssh exit=$?"
          set -e

      # --- If SSH works, deploy. If not, this will fail with a clear log above. ---
      - name: Deploy dist/ to public_html via rsync (uses SSH)
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}
