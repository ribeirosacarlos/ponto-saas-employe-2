name: Deploy Vite (dist) to Hostinger (main)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build
        
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Ensure known_hosts (best effort)
        run: |
          set +e
          ssh-keyscan -T 20 -p 22 -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts
          echo "ssh-keyscan exit code: $?"
          set -e

      - name: Test SSH (shows real error)
        run: |
          ssh -p 22 -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "whoami && pwd"

      - name: Deploy dist/ to public_html via rsync
        run: |
          rsync -az --delete \
            -e "ssh -p 22 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}

